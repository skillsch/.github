<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="SKILL.SCH — Developing skills. Strengthening futures.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1E48"/>
      <stop offset="1" stop-color="#132E6B"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>

  <!-- ribbon mark, echoing the logo -->
  <g fill="none" stroke-linecap="round" stroke-width="14" transform="translate(1010 40)">
    <path d="M40 30 C 160 30, 160 90, 60 100" stroke="#1FA34A"/>
    <path d="M60 100 C 180 110, 180 170, 70 175" stroke="#F2B705"/>
    <path d="M70 175 C 190 180, 190 235, 80 240" stroke="#E5383B"/>
    <path d="M30 60 C 120 70, 130 120, 40 135" stroke="#2D6CDF" stroke-opacity="0.9"/>
    <path d="M40 135 C 140 145, 150 200, 50 210" stroke="#2D6CDF" stroke-opacity="0.6"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="128" fill="#FFFFFF" font-size="72" font-weight="800" letter-spacing="2">SKILL<tspan fill="#F2B705">.</tspan>SCH</text>
    <text x="82" y="178" fill="#FFFFFF" font-size="28" font-weight="600">Developing skills. Strengthening futures.</text>
    <text x="82" y="218" fill="#C9D6F2" font-size="20">Cloud · DevOps · Data · AI — live mentorship and real-world projects</text>

    <g font-size="15" font-weight="600">
      <rect x="82" y="246" width="96" height="32" rx="16" fill="#1FA34A" fill-opacity="0.18" stroke="#1FA34A"/>
      <text x="130" y="267" fill="#FFFFFF" text-anchor="middle">CloudLabs</text>
      <rect x="190" y="246" width="128" height="32" rx="16" fill="#F2B705" fill-opacity="0.18" stroke="#F2B705"/>
      <text x="254" y="267" fill="#FFFFFF" text-anchor="middle">SSlab Engine</text>
      <rect x="330" y="246" width="96" height="32" rx="16" fill="#E5383B" fill-opacity="0.18" stroke="#E5383B"/>
      <text x="378" y="267" fill="#FFFFFF" text-anchor="middle">Arcade</text>
      <rect x="438" y="246" width="148" height="32" rx="16" fill="#2D6CDF" fill-opacity="0.22" stroke="#2D6CDF"/>
      <text x="512" y="267" fill="#FFFFFF" text-anchor="middle">skill-sch.com</text>
    </g>
  </g>
</svg>
